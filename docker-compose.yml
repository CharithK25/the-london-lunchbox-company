services:
  db:
    image: postgres:16
    container_name: lunchbox-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: lunchboxdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: lunchbox-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: charithk25@hotmail.com
      PGADMIN_DEFAULT_PASSWORD: secret
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata: